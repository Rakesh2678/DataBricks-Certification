<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataBricks Certification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #d33f49;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 250px;
      height: 150px; /* Ensures both cards have the same height */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: transform 0.2s ease-in-out;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card h2 {
      color: #444;
      margin: 0;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>DataBricks Certification</h1>

  <div class="card-container">
    <a href="./DataEngineeringAssociate.html" target="_blank">
      <div class="card">
        <h2>PR000054 - Data Engineer Associate</h2>
      </div>
    </a>
    <a href="./AIEngineerAssociate.html" target="_blank">
      <div class="card">
        <h2>PR000065 - Generative AI Engineer Associate</h2>
      </div>
    </a>
  </div>

</body>
</html>
